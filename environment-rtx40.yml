# Environment and PPO dependencies for the RTX 40-series / Python 3.8 setup.
# Alternative to environment.yml; run the supplied checks on the evaluation GPU.
# Isaac Gym Preview 4 must be installed separately; see README.md.
name: stage1-gym-rtx40
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.8.20
  - pip=24.3.1
  - setuptools=75.3.0
  - wheel=0.45.1
  - pip:
      - --index-url https://pypi.org/simple
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.1+cu121
      - torchvision==0.18.1+cu121
      - numpy==1.23.5
      - gym==0.26.2
      - cloudpickle==3.1.1
      - gym-notices==0.1.0
      - importlib-metadata==8.5.0
      - zipp==3.20.2
      - ninja==1.13.2
      - packaging==26.2
      - filelock==3.16.1
      - typing-extensions==4.13.2
      - sympy==1.13.3
      - mpmath==1.3.0
      - networkx==3.1
      - jinja2==3.1.6
      - MarkupSafe==2.1.5
      - fsspec==2025.3.0
      - scipy==1.10.1
      - PyYAML==6.0.3
      - pillow==10.4.0
      - imageio==2.35.1
      - imageio-ffmpeg==0.5.1
      - nvidia-cublas-cu12==12.1.3.1
      - nvidia-cuda-cupti-cu12==12.1.105
      - nvidia-cuda-nvrtc-cu12==12.1.105
      - nvidia-cuda-runtime-cu12==12.1.105
      - nvidia-cudnn-cu12==8.9.2.26
      - nvidia-cufft-cu12==11.0.2.54
      - nvidia-curand-cu12==10.3.2.106
      - nvidia-cusolver-cu12==11.4.5.107
      - nvidia-cusparse-cu12==12.1.0.106
      - nvidia-nccl-cu12==2.20.5
      - nvidia-nvjitlink-cu12==12.9.86
      - nvidia-nvtx-cu12==12.1.105
      - triton==2.3.1
