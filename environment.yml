# Pinned environment and PPO dependencies for the RTX 50-series / Python 3.8 setup.
# Run `conda env create -f environment.yml` FROM THIS DIRECTORY.
# Isaac Gym Preview 4 and system CUDA/MPI libraries are external: see README.md.
# The local torch wheel is intentionally bundled; it is not a public PyPI release.
name: stage1-gym
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.8.20
  - pip=24.3.1
  - setuptools=75.3.0
  - wheel=0.45.1
  - pip:
      - --index-url https://pypi.org/simple
      - numpy==1.23.5
      - gym==0.26.2
      - cloudpickle==3.1.1
      - gym-notices==0.1.0
      - importlib-metadata==8.5.0
      - zipp==3.20.2
      - ninja==1.13.2
      - packaging==26.2
      - filelock==3.16.1
      - typing-extensions==4.13.2
      - sympy==1.13.3
      - mpmath==1.3.0
      - networkx==3.1
      - jinja2==3.1.6
      - MarkupSafe==2.1.5
      - fsspec==2025.3.0
      - scipy==1.10.1
      - PyYAML==6.0.3
      - pillow==10.4.0
      - imageio==2.35.1
      - imageio-ffmpeg==0.5.1
      - ./vendor/torch-2.3.0a0+git63d5e92-cp38-cp38-linux_x86_64.whl
